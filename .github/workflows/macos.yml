name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The core (SNMP, drivers, rack arithmetic, restart sequence) is plain Swift and is tested on Linux: cheap and fast.
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test 2>&1 | tail -n 60
  # The host agent runs on AlmaLinux 9 with Python 3.9: it is tested with that version and with a new one.
  hostagent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s hostagent/tests -v 2>&1 | tail -n 40
      - run: bash -n hostagent/install.sh
  # The server (Go) runs on Ubuntu 22.04: it is tested here and the static binary is the artifact to install.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format and vet
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Tests (with the race detector)
        working-directory: server
        run: go test -race ./... 2>&1 | tail -n 40
      - name: Build the binary
        working-directory: server
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::8}" -o dist/pdumonitord ./cmd/pdumonitord
          cp -r deploy dist/deploy
          mkdir -p dist/hostagent
          cp -r ../hostagent/install.sh ../hostagent/hostinfo.py ../hostagent/systemd ../hostagent/README.md ../hostagent/FORMAT.md dist/hostagent/
          ./dist/pdumonitord version
      - uses: actions/upload-artifact@v4
        with:
          name: pdu-monitor-server
          path: server/dist
  app:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the signing certificate (skipped without the Secrets)
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash scripts/import-certificate.sh
      - name: Toolchain
        run: swift --version
      - name: Compile everything
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log | grep -E 'error|Build complete' | tail -n 80
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | grep -E 'error:|Executed [0-9]+ tests, with|Test Case .* failed|Fatal error' | tail -n 60
      - name: Screenshots of the real window with the demo racks
        continue-on-error: true
        env:
          PDUMONITOR_SNAPSHOTS: ${{ github.workspace }}/build/screenshots
        run: swift test --filter SnapshotTests 2>&1 | tail -n 15
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Build the application (Apple Silicon and Intel)
        run: bash scripts/build-app.sh
      - name: Smoke test the packaged application
        run: |
          "build/PDUMonitor.app/Contents/MacOS/PDUMonitor" > build/smoke.log 2>&1 &
          app_pid=$!
          sleep 6
          if ! kill -0 "$app_pid" 2>/dev/null; then cat build/smoke.log; exit 1; fi
          kill "$app_pid"
      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: PDUMonitor
          path: build/PDUMonitor-*.zip
          if-no-files-found: error
